# 实验 A0：YOLOv8n 640 Baseline
model: yolov8n.pt
data: configs/dataset_configs/visdrone.yaml

# 核心训练设置
epochs: 200
imgsz: 640
batch: 16
workers: 8
device: 0
seed: 0
deterministic: true
pretrained: true
amp: true

# 优化器与学习率
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true
nbs: 64

# 数据增强：作为所有主消融的固定训练配方
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
close_mosaic: 10
multi_scale: false
rect: false

# 验证与输出
val: true
conf: 0.001
iou: 0.7
max_det: 1000
patience: 50
save: true
save_period: 10
plots: true
project: runs/baseline
name: A0-yolov8n-640-seed0
exist_ok: false
cache: false

